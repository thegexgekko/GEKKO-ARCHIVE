[package]
name = "gekko-archive"
version = "0.6.1"
description = "GEKKO ARCHIVE — utilitaire local Windows 11"
authors = ["GEKKO SOFTWARE"]
edition = "2021"

[lib]
name = "gekko_archive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

# Glisser-déposer natif sortant vers l'Explorateur Windows (MIT/Apache-2.0).
tauri-plugin-drag = "2.1.1"
