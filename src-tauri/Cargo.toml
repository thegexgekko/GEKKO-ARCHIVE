[package]
name = "gekko-archive"
version = "0.4.0"
description = "GEKKO ARCHIVE — utilitaire local Windows 11"
authors = ["GEKKO SOFTWARE"]
edition = "2021"

[lib]
name = "gekko_archive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
